<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Find All My Tags</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="static/style.css">
<script src="static/i18n.js"></script>
<link rel="manifest" href="static/manifest.webmanifest">
<meta name="theme-color" content="#2563eb">
</head>
<body>
<div id="map"></div>

<aside id="panel">
  <div class="panel-head">
    <div class="brand"><span class="dot"></span> Find All My Tags</div>
    <span id="sync" class="sync-badge off" title="Google Drive sync">Drive</span>
    <button id="lang" class="sync-badge off" data-lang-switch type="button">DE</button>
    <button id="toggle" class="icon toggle-big" title="Hide panel" aria-label="Hide panel">▾</button>
  </div>

  <div class="panel-body">
    <div id="detail" class="detail" hidden></div>
    <div id="latest" class="latest"></div>

    <div id="historyBox" hidden>
      <div class="field"><span id="histTitle">History</span>
        <div class="chips" id="ranges">
          <button data-h="today">Today</button>
          <button data-h="24">24 h</button>
          <button data-h="48">2 days</button>
          <button data-h="168" class="on">7 days</button>
          <button data-h="720">30 days</button>
          <button data-h="2160">90 days</button>
          <button data-h="8760">1 year</button>
          <button data-h="custom">Custom</button>
        </div>
      </div>
      <div id="custom" class="custom" hidden>
        <label>From<input type="datetime-local" id="from"></label>
        <label>To<input type="datetime-local" id="to"></label>
        <button id="applyCustom">Show</button>
      </div>
      <div class="stats" id="stats"></div>
      <div class="field">Playback
        <div class="playback">
          <button id="play" class="icon" title="Play">▶</button>
          <input type="range" id="scrub" min="0" max="0" value="0">
        </div>
        <div class="muted small" id="scrubLabel">&nbsp;</div>
      </div>
      <label class="check"><input type="checkbox" id="showPoints" checked> Show individual points</label>
      <div class="row">
        <button id="csv">CSV</button>
        <button id="gpx">GPX</button>
      </div>
    </div>

    <div class="row">
      <button id="pollNow" class="primary">Check all now</button>
    </div>
    <div class="muted small" id="pollStatus"></div>

    <div class="field">View
      <div class="views">
        <span>Display</span>
        <div class="seg" data-theme-key="theme"><button data-v="auto">Auto</button><button data-v="light">Light</button><button data-v="dark">Dark</button></div>
        <span>Map</span>
        <div class="seg" data-theme-key="mapTheme"><button data-v="auto">Auto</button><button data-v="light">Light</button><button data-v="dark">Dark</button></div>
      </div>
    </div>
    <label class="check"><input type="checkbox" id="onlineAddress"> Show the tag's address in the details</label>
    <div class="muted small"><a id="addrHelp" href="help.html#address">What happens here?</a></div>

    <div class="row foot">
      <button id="pcView" class="link" hidden>🖥 PC view</button>
      <button id="server" class="link" hidden>Change server</button>
      <button id="logout" class="link">Sign out</button>
    </div>
  </div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="static/app.js"></script>
</body>
</html>
