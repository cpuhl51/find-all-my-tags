name: Android APK

# main    = Testversion (Beta): APK nur als Build-Artefakt
# release = Live-Version: Push auf den Branch "release" veröffentlicht ein GitHub-Release v<Version>
on:
  push:
    branches: [main]
    paths: ["android/**", "web/**", "server/**", ".github/workflows/android.yml"]
  workflow_dispatch:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Fetch GoogleFindMyTools (bundled into the APK)
        run: |
          git clone https://github.com/leonboe1/GoogleFindMyTools vendor/GoogleFindMyTools
          git -C vendor/GoogleFindMyTools checkout d46e9528578015b51d3b84dd91bf8f16e9ab850f
        working-directory: ${{ github.workspace }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Decode signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk FindAllMyTags.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FindAllMyTags-apk
          path: android/FindAllMyTags.apk

      - name: Prepare release notes
        if: inputs.publish
        id: notes
        working-directory: ${{ github.workspace }}
        run: |
          python3 - <<'PY'
          import json, os
          v = json.load(open("web/version.json"))
          cur = v["verlauf"][0]
          lines = ["### Neu in dieser Version"] + [f"- {x}" for x in cur.get("aenderungen", [])]
          if cur.get("aenderungen_en"):
              lines += ["", "### What's new"] + [f"- {x}" for x in cur["aenderungen_en"]]
          lines += ["", "**Installieren:** `FindAllMyTags.apk` auf dem Android-Handy herunterladen und öffnen. "
                    "Updates einfach über die alte Version installieren, die Daten bleiben erhalten."]
          open("release-notes.md", "w").write("\n".join(lines) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={v['version']}\n")
          PY

      - name: Publish release
        if: inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.notes.outputs.version }}
          name: Find All My Tags ${{ steps.notes.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          make_latest: true
          files: android/FindAllMyTags.apk
